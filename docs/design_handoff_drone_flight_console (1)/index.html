<!-- =====================================================================
  드론 시뮬레이션 콘솔 — 설계 메모
  ---------------------------------------------------------------------
  · 가정: 별도 디자인 시스템이 없으므로 아래 톤을 새로 정의했습니다.
      - 밝은 테마. 배경은 살짝 녹색기가 도는 뉴트럴(#f1f3f2)로, 순백 패널과
        구분되게 했습니다. 산업용 계기/관제 장비의 사출 플라스틱 느낌을
        노린 선택입니다. 채도는 낮게(oklch 기준 chroma 0.005 내외) 유지.
      - 강조색은 단 하나 — 딥 블루(#1f74d8). "기체/현재 위치/현재 값"에만
        씁니다. 초록=정상, 앰버=주의, 레드=경고는 상태 전용으로 분리해서
        강조색과 의미가 섞이지 않게 했습니다.
      - 지형은 HSL 램프 6단계로만 표현(고도대별 색상 + 사면 음영). 위성사진
        대신 등고 색상 지도 스타일 — 라이선스 문제도 없고 수치와 잘 맞습니다.
      - 타입: IBM Plex Sans KR(UI) + IBM Plex Mono(모든 숫자). 숫자는 전부
        tabular-nums 로 고정폭. 값이 흔들려도 자릿수가 안 움직입니다.
  · 수치(속도/고도/거리/자세/배터리/GNSS)는 전부 실제 물리 적분 결과입니다.
    목업 숫자가 아니라 sim.js 가 60Hz 로 계산한 상태를 그대로 읽습니다.
  · 4가지 레이아웃을 Tweaks 로 즉시 전환할 수 있게 했습니다.
  ===================================================================== -->
