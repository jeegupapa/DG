# 태그(v*)를 push 하면 Windows 에서 exe·설치파일을 빌드해 GitHub Release 에 올린다.
# 프로그램의 자동 업데이트는 이 릴리스의 자산(DroneMissionSim-Setup.exe, DroneMissionSim.exe, SHA256SUMS.txt)을 사용한다.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 태그와 소스 버전 일치 확인
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $src = (Select-String -Path dronesim\__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $src) { throw "태그 v$tag 와 dronesim/__init__.py 의 __version__ $src 이 다릅니다." }
          "version=$src" >> $env:GITHUB_OUTPUT
        id: ver

      - name: 의존성 설치
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: 테스트
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -q

      - name: exe 빌드
        shell: pwsh
        run: .\build.ps1

      - name: 설치파일 빌드
        shell: pwsh
        run: .\installer\make_installer.ps1

      - name: 체크섬 생성
        shell: pwsh
        run: |
          $lines = @()
          foreach ($f in @("DroneMissionSim-Setup.exe", "DroneMissionSim.exe")) {
            $h = (Get-FileHash -Algorithm SHA256 "dist\$f").Hash.ToLower()
            $lines += "$h  $f"
          }
          [System.IO.File]::WriteAllLines("dist\SHA256SUMS.txt", $lines)
          Get-Content dist\SHA256SUMS.txt

      - name: 릴리스 생성·자산 업로드
        uses: softprops/action-gh-release@v2
        with:
          name: "드론 임무 시뮬레이터 v${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/DroneMissionSim-Setup.exe
            dist/DroneMissionSim.exe
            dist/SHA256SUMS.txt
